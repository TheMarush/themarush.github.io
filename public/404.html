<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Marie Anna Mahdalová</title>
    <script>
      // Redirect 404s back to index.html with the path encoded as a query param.
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
